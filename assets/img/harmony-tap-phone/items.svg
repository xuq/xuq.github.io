<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12213b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .t{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; fill:#e2e8f0}
      .h{font-weight:800; fill:#fff}
      .card{fill:#0f172a; stroke:#334155; stroke-width:2; rx:18; ry:18}
      .label{font-size:20px; font-weight:700}
      .sub{font-size:16px; opacity:.85}
      .icon{fill:url(#accent)}
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <text x="70" y="88" class="t h" font-size="36">Typical items shared via Phone ↔ Phone Tap-to-Share</text>
  <text x="70" y="125" class="t" font-size="18" opacity="0.85">(Availability depends on device / OS / app version)</text>

  <!-- cards grid -->
  <g transform="translate(70,170)">
    <!-- Photo/Video -->
    <rect class="card" x="0" y="0" width="340" height="140"/>
    <g transform="translate(26,26)">
      <rect x="0" y="0" width="54" height="54" rx="12" class="icon" opacity="0.25"/>
      <path class="icon" d="M16 16h22a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4zm0 6v16h22V22H16zm3 14 4-5 5 6 4-5 5 7H19z"/>
    </g>
    <text x="100" y="52" class="t label">Photos / Videos</text>
    <text x="100" y="82" class="t sub">Gallery items, quick handoff</text>

    <!-- WLAN / Hotspot -->
    <rect class="card" x="380" y="0" width="340" height="140"/>
    <g transform="translate(406,26)">
      <rect x="0" y="0" width="54" height="54" rx="12" class="icon" opacity="0.25"/>
      <path class="icon" d="M27 40a4 4 0 1 0 0.001 0zM12 28a22 22 0 0 1 30 0l-4 4a16 16 0 0 0-22 0l-4-4zm-6-6a30 30 0 0 1 42 0l-4 4a24 24 0 0 0-34 0l-4-4z"/>
    </g>
    <text x="480" y="52" class="t label">WLAN / Hotspot</text>
    <text x="480" y="82" class="t sub">Share network info with a tap</text>

    <!-- Documents -->
    <rect class="card" x="760" y="0" width="340" height="140"/>
    <g transform="translate(786,26)">
      <rect x="0" y="0" width="54" height="54" rx="12" class="icon" opacity="0.25"/>
      <path class="icon" d="M18 14h18l8 8v20a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4zm18 2v8h8"/>
      <path class="icon" d="M20 30h24v4H20zM20 38h18v4H20z"/>
    </g>
    <text x="860" y="52" class="t label">Documents</text>
    <text x="860" y="82" class="t sub">Links, files, app-specific items</text>

    <!-- row2: contacts / misc -->
    <rect class="card" x="0" y="170" width="340" height="140"/>
    <g transform="translate(26,196)">
      <rect x="0" y="0" width="54" height="54" rx="12" class="icon" opacity="0.25"/>
      <path class="icon" d="M27 16a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-16 34c4-8 12-12 16-12s12 4 16 12H11z"/>
    </g>
    <text x="100" y="222" class="t label">Contacts (some apps)</text>
    <text x="100" y="252" class="t sub">Dependent on app integration</text>

    <rect class="card" x="380" y="170" width="720" height="140"/>
    <text x="410" y="222" class="t label">Interaction detail</text>
    <text x="410" y="254" class="t sub">A tap triggers discovery; UI prompts guide sender “swipe up to send” and receiver “tap to accept”.</text>
  </g>
</svg>
