<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a2b6b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- two phones -->
  <g transform="translate(320,150)" filter="url(#soft)">
    <rect x="0" y="0" rx="28" ry="28" width="250" height="380" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="48" rx="18" ry="18" width="202" height="284" fill="#0b1020" stroke="#1f2a44" stroke-width="2"/>
    <circle cx="125" cy="26" r="6" fill="#94a3b8"/>
  </g>
  <g transform="translate(630,150)" filter="url(#soft)">
    <rect x="0" y="0" rx="28" ry="28" width="250" height="380" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="48" rx="18" ry="18" width="202" height="284" fill="#0b1020" stroke="#1f2a44" stroke-width="2"/>
    <circle cx="125" cy="26" r="6" fill="#94a3b8"/>
  </g>

  <!-- tap glow -->
  <g>
    <circle cx="600" cy="340" r="90" fill="url(#glow)" opacity="0.18"/>
    <circle cx="600" cy="340" r="52" fill="url(#glow)" opacity="0.28"/>
    <circle cx="600" cy="340" r="18" fill="url(#glow)" opacity="0.85"/>
  </g>

  <!-- title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="#ffffff">
    <text x="80" y="92" font-size="40" font-weight="700">HarmonyOS · Tap-to-Share</text>
    <text x="80" y="135" font-size="26" opacity="0.88">Phone ↔ Phone “碰一碰”</text>
  </g>

  <!-- footer label -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="#cbd5e1" opacity="0.9">
    <text x="80" y="592" font-size="18">Cross-device sharing via a physical gesture · reference-only</text>
  </g>
</svg>
